app:
  host: 127.0.0.1
  port: 8765
  timezone: Asia/Shanghai
  db_path: data/deskhub.db
  log_path: data/logs/deskhub.log

digest:
  limit: 8              # 日报条数（spec: 5-10）
  lookback_hours: 48    # 候选池回溯窗口，当日无数据时的回退

fetch:
  timeout_seconds: 10
  user_agent: "deskhub/1.0 (personal rss reader)"
  max_items_per_source: 30    # 首次抓取历史条目上限，防首跑灌爆
  max_concurrency: 1          # spec §6.2 要求串行；>15 个源时再调

scoring:
  concurrency: 3
  max_summary_chars: 1500     # 送模型的摘要截断
  max_attempts: 2             # 单条最多重试次数
  prompt_version: v1
  temperature: 0.2

llm:
  base_url: https://api.deepseek.com
  model: deepseek-v4-flash
  api_key_env: DESKHUB_LLM_API_KEY   # 只写环境变量名，不写密钥本身
  # 单次请求超时（秒）。批量抽取画像实测 30s 会把大多数请求打成 ReadTimeout，故放宽
  timeout_seconds: 120

modules:
  agent:
    label: Agent 开发
    focus: >
      框架与工具动态（LangGraph/AutoGen/MCP/agent SDK）、论文与方法（规划、
      记忆、多智能体协作、评测）、实战案例与踩坑、Agent 产品与行业动态。
  bigdata:
    label: 大数据
    focus: >
      Hadoop/Spark/Flink/湖仓（Iceberg/Hudi/Paimon）/Hive 技术栈；
      数据工程与实时计算、数据治理、调度编排（Airflow/DolphinScheduler）、
      性能调优与生产事故复盘。

# 铜币拍卖（spec §14 / plan §18.10）
coins:
  enabled: true
  orders_xlsx: data/orders.xlsx          # 画像输入（麦稀奇历史成交导出）
  # 小程序网关：采集（专场 + 拍品）与查价（站内历史成交）的**唯一**来源
  # （免登录、免签名、免浏览器，见 app/coins/gapi.py）
  gapi_base_url: https://gapi.mxiqi.com
  request_interval_seconds: 3            # 限速：每次请求间隔（对网关客气点）
  # 单轮采集专场上限。gapi 一次给全部当前专场（实测 实时 18 + 限时 25 ≈ 43），
  # 上限给足即可，别把排在后面的场截掉。
  max_sessions_per_run: 80
  match_threshold: 1.5                   # 匹配分阈值（spec §14.11，跑通后按真实数据校准）
  price:
    status: 成交                          # 只用成交样本，不拿挂牌/流拍
    window_days: 180                      # 历史成交回溯窗口
    min_samples: 3                        # 少于 3 条只给区间，不给单一价
    statistic: median                     # median | mean
    query_interval_seconds: 15            # 每次查价之间停 15 秒（实际带 ±40% 抖动 → 9~21 秒）
    max_queries_per_run: 20               # 单轮最多查 20 条；剩下的留到下一轮/第二天
  profile_llm:
    prompt_version: coins-v1
    batch_size: 20                        # 每次送模型抽取的订单条数
    concurrency: 6                        # 抽取批次的并发数（一次性批量任务，可比打分高）
  # 收藏画像与三层推荐（spec/coins.md §14.17）
  collection:
    min_results: 5                        # 前两层推荐少于此数时才触发第三层相似推荐
    rarity_floor: 0.005                   # 稀缺权重 = 1 / max(rarity, 0.005)
    top_upgrades_per_series: 3            # 每个收藏系列的升级项最多几个
    # 面值层级：同一组里的面值视为同一层级（跨系列相似推荐用）
    denomination_tiers:
      - ["penny", "便士", "10 centimes", "10 分"]
    # 候选池扫描：从收藏画像的尺寸出发，用目录页筛选外部铜币（参数即 Numista URL 参数）
    explore_size_tolerance_mm: 2.0        # 与种子系列尺寸差 ≤ 此值才入候选池
    explore_max_details: 10               # 单轮最多取几个候选的详情（每个详情另取一次年份）
    explore_catalogue:                    # 目录筛选（后续换条件只改这里）
      collectible_type: 1                 # st：1 = Standard circulation coins
      year: "1800-2026"                   # a：年份区间
      composition_id: 5                   # m：5 = Bronze
      diameter_mm: "28-33"                # t：长度或直径（mm）
      per_page: 200                       # q：每页条数（10/20/50/100/200）
  # Numista 目录接口（铜币参考库：按国家/年份/面值查系列，按系列号查全部单版）
  # API Key 只写环境变量名，真实值放 .env（见 .env.example）
  numista:
    base_url: https://api.numista.com/v3
    api_key_env: DESKHUB_NUMISTA_API_KEY
    request_interval_seconds: 2           # 请求间隔（免费额度有限，客气点）
    max_series: 10                        # 单次搜索最多取几个系列的详情（Type Detail 有配额）
    timeout_seconds: 20
    monthly_limit: 1500                   # 每月请求上限（免费额度 2000，留 25% 余量）
    max_requests_per_run: 40              # 单轮请求上限（一次 CLI 最多打几次接口）
    # 取类型页（各品相估值 + Frequency）走网页表格：numista.com 有 Cloudflare 校验，
    # 普通 HTTP 客户端一律 403，只能挂到你**自己用调试端口开的 Chrome** 上（见 README）
    cdp_url: http://127.0.0.1:9222
