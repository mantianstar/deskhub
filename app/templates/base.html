<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}deskhub{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}?v=20261019e">
</head>
<body>
  <header class="site-head">
    <a class="brand" href="/">deskhub</a>
    <nav class="nav">
      <a class="nav-link" href="/">日报</a>
      {% for key, label in nav_modules() %}
      <a class="nav-link" href="/m/{{ key }}">{{ label }}</a>
      {% endfor %}
      <a class="nav-link" href="/search">历史搜索</a>
      <a class="nav-link" href="/sources">源管理</a>
      <a class="nav-link" href="/control">运行控制</a>
      <a class="nav-link" href="/funds">基金</a>
      <a class="nav-link" href="/coins/collection">铜币</a>
    </nav>
  </header>

  <main class="content{% block content_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-foot">本地服务 · 只有我一个人用</footer>

  <div class="coin-lightbox" id="coin-lightbox" hidden>
    <img alt="放大查看">
  </div>

  <script>
    // 点击外链后置灰，防止重复点（无框架、无 CDN）
    document.addEventListener("click", function (event) {
      var link = event.target.closest("a.item-link");
      if (link) { link.classList.add("is-clicked"); }
    });

    // 图片点击放大（原生、无框架、无 CDN）：点缩略图开灯箱，点遮罩 / 再点图 / Esc 关闭。
    // 缩略图可能包在链接里（专场卡片），故拦截默认跳转。
    document.addEventListener("click", function (event) {
      var box = document.getElementById("coin-lightbox");
      var img = event.target.closest("img.coin-zoom");
      if (img) {
        event.preventDefault();
        event.stopPropagation();
        box.querySelector("img").src = img.src;
        box.hidden = false;
        return;
      }
      if (event.target === box || event.target === box.querySelector("img")) {
        box.hidden = true;
        box.querySelector("img").removeAttribute("src");
      }
    });

    document.addEventListener("keydown", function (event) {
      var box = document.getElementById("coin-lightbox");
      if (event.key === "Escape" && !box.hidden) {
        box.hidden = true;
        box.querySelector("img").removeAttribute("src");
      }
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
